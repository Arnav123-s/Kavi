<g font-family="Arial, sans-serif" fill="#17334d">
<text x="40" y="48" font-size="26" font-weight="bold">Kavi PCL · Phase Circuit Learner</text>
<text x="40" y="77" font-size="16">Implemented mechanics; an acquired internal world remains a target. Visualization is optional.</text>
<text x="40" y="106" font-size="15">Execution below uses a fixed device envelope. The learned habitat boundary is documented separately.</text>
