<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
<title id="title">Kavi PCL: current activity and persistent learning</title>
<desc id="desc">Input passes through encoding into coupled phase activity. Output waits for input completion. Teaching proposes a replacement configuration which must pass correction and retention checks. Current phases and lasting configuration occupy different storage.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#48627b"/></marker></defs>
