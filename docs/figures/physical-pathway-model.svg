<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510"><title>Internal physical-pathway proposal</title><desc>Proposed software mechanism by Arnav123-s. Not implemented.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#426176"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172a38;font-size:18px}.head{font-weight:bold;font-size:21px}.box{fill:#edf3f7;stroke:#8ca5b5}.flow{stroke:#426176;stroke-width:2;fill:none;marker-end:url(#arr)}</style><rect width="1000" height="510" fill="white"/><text x="30" y="40" class="head">Internal physics proposal: exploration changes; correctness remains a contract</text>
<rect class="box" x="30" y="90" width="270" height="120" rx="9"/><text x="45" y="120" class="head">Typed input and context</text><text x="45" y="155">component properties</text><text x="45" y="180">available rules / catalysts</text>
<rect class="box" x="365" y="90" width="270" height="120" rx="9"/><text x="380" y="120" class="head">Shared pathway</text><text x="380" y="155">bounded candidate routes</text><text x="380" y="180">explicit execution cost</text>
<rect class="box" x="700" y="90" width="270" height="120" rx="9"/><text x="715" y="120" class="head">Independent checks</text><text x="715" y="155">value, types, evidence</text><text x="715" y="180">retained task behavior</text>
<path class="flow" d="M300,150 L360,150"/><path class="flow" d="M635,150 L695,150"/>
<rect class="box" x="365" y="300" width="270" height="110" rx="9"/><text x="380" y="330" class="head">Heat / cooling signal</text><text x="380" y="365">adjust exploration rates</text><text x="380" y="390">do not redefine correctness</text>
<path class="flow" d="M835,210 L835,355 L640,355"/><path class="flow" d="M500,300 L500,215"/>
<text x="30" y="455">Learning the structure is separate from settling within one fixed structure.</text><text x="30" y="482">Rates, temperatures, branch states and durable connections all count toward resource use.</text></svg>