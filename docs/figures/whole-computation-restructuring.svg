<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470"><title>Whole-computation restructuring</title><desc>Algebraic illustration by Arnav123-s; not a learned Kavi result.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#426176"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172a38;font-size:20px}.title{font-size:24px;font-weight:bold}.eq{font-size:34px}.small{font-size:18px}</style><rect width="1000" height="470" fill="white"/><text x="30" y="40" class="title">Change the computation; preserve its valid obligations</text><rect x="30" y="85" width="400" height="150" rx="9" fill="#edf3f7" stroke="#8ca5b5"/><text x="50" y="123">Before: repeated work</text><text x="50" y="172" class="eq">a*b + a*c</text><text x="50" y="210" class="small">two multiplications, one addition</text><rect x="570" y="85" width="400" height="150" rx="9" fill="#edf3f7" stroke="#8ca5b5"/><text x="590" y="123">After: shared structure</text><text x="590" y="172" class="eq">a*(b + c)</text><text x="590" y="210" class="small">one multiplication, one addition</text><path d="M435,160 L560,160" stroke="#426176" stroke-width="2" marker-end="url(#a)"/><rect x="150" y="295" width="700" height="105" rx="9" fill="#edf3f7" stroke="#8ca5b5"/><text x="170" y="330">Check the domain, prior obligations and actual execution cost.</text><text x="170" y="366">The identity holds for exact integers; this is an illustration.</text><text x="30" y="442" class="small">Whole regions may change. Old wiring is not the contract; valid behavior is.</text></svg>