[project]
name = "kavi"
version = "0.1.0"
description = "A bounded experimental path-centric adaptive circuit model."
requires-python = ">=3.11"
authors = [{ name = "Arnav123-s" }]

[project.optional-dependencies]
wave = ["torch>=2.6,<3"]

[project.scripts]
kavi = "kavi.cli:main"
kavi-school = "kavi.school_cli:main"
kavi-catalog = "kavi.catalog_cli:main"
kavi-pathways = "kavi.pathway_cli:main"
kavi-live = "kavi.wave_cli:main"

[tool.unittest]
start-directory = "tests"
